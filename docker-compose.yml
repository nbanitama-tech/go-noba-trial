services:
  api:
    build:
      context: .
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      HTTP_ADDRESS: ":8080"
      SERVICE_NAME: "go-noba-trial"
      DATABASE_URL: "postgres://noba:noba_password@postgres:5432/noba?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "noba"
      POSTGRES_USER: "noba"
      POSTGRES_PASSWORD: "noba_password"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noba -d noba"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
