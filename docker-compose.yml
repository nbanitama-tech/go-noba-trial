services:
  api:
    build:
      context: .
    restart: on-failure
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./config.docker.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "noba"
      POSTGRES_USER: "noba"
      POSTGRES_PASSWORD: "noba_password"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noba -d noba"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
